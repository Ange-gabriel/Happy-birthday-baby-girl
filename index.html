<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birth day baby girl 🥹</title>
<meta name="description" content="Un journal qu'on ne devrait pas trouver par hasard.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Caveat:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/intro.css">
<link rel="stylesheet" href="assets/css/book.css">
<link rel="stylesheet" href="assets/css/letter.css">
</head>
<body data-stage="void">

<canvas id="stars-canvas" aria-hidden="true"></canvas>
<div class="grain-overlay" aria-hidden="true"></div>
<div class="scanlines-overlay" id="scanlines-overlay" aria-hidden="true"></div>
<div class="flash-overlay" id="flash-overlay" aria-hidden="true"></div>

<button id="mute-toggle" class="mute-toggle" type="button" aria-label="Couper / activer le son">🔈</button>

<main id="app">

  <section id="scene-intro" class="scene is-active">

    <!-- Nouvelle première page : photo + lune cliquable -->
    <div class="stage stage-moon" id="stage-moon">
      <div class="photo-backdrop" id="photo-backdrop"></div>
      <div class="moon-wrap" id="moon-wrap" role="button" tabindex="0" aria-label="Cliquer sur la lune">
        <div class="moon" id="moon"></div>
      </div>
      <p class="moon-line" id="moon-line">The moon 🌑... The moon is pretty, isn't it?</p>
    </div>

    <div class="stage stage-prologue" id="stage-prologue" hidden>
      <div class="photo-backdrop is-dimmed" id="photo-backdrop-prologue"></div>
      <div class="word-line" id="prologue-line"></div>
      <div class="avatar-slot" id="avatar-slot">
        <div class="avatar-bubble" id="avatar-bubble">
          <span class="avatar-emoji" id="avatar-emoji"></span>
          <span class="avatar-text" id="avatar-text"></span>
        </div>
      </div>
    </div>

    <div class="stage stage-glitch" id="stage-glitch" hidden>
      <div class="word-line" id="glitch-line"></div>
      <div class="avatar-slot" id="avatar-slot-glitch">
        <div class="avatar-bubble" id="avatar-bubble-glitch">
          <span class="avatar-emoji" id="avatar-emoji-glitch"></span>
          <span class="avatar-text" id="avatar-text-glitch"></span>
        </div>
      </div>
      <p class="tap-hint">(touche l'écran pour passer)</p>
    </div>

    <div class="stage stage-password" id="stage-password" hidden>
      <p class="password-label" id="password-label">Mot de passe 1 / 3</p>
      <div class="password-slots" id="password-slots"></div>
      <div class="orbit-field" id="orbit-field"></div>
      <div class="password-footer">
        <div class="lives" id="lives-indicator"></div>
        <button class="hint-btn" id="hint-btn" type="button">💡 indice</button>
      </div>
      <p class="hint-panel" id="hint-panel" hidden></p>
      <div class="avatar-slot" id="avatar-slot-password">
        <div class="avatar-bubble" id="avatar-bubble-password">
          <span class="avatar-emoji" id="avatar-emoji-password"></span>
          <span class="avatar-text" id="avatar-text-password"></span>
        </div>
      </div>
    </div>

    <div class="stage stage-continue" id="stage-continue" hidden>
      <p class="continue-caption" id="continue-caption">Tout est vérifié. Presque...</p>
    </div>
    <button class="btn-continue" id="btn-continue" hidden type="button">Commencer →</button>

  </section>

  <section id="scene-book" class="scene" hidden>
    <div id="book-root"></div>
  </section>

  <section id="scene-letter" class="scene" hidden></section>

  <section id="scene-epilogue" class="scene" hidden></section>

  <section id="scene-finale" class="scene" hidden></section>

</main>

<audio id="snd-ambient" src="assets/sounds/ambient.mp3" loop preload="none"></audio>
<audio id="snd-glitch" src="assets/sounds/glitch.mp3" preload="none"></audio>
<audio id="snd-whoosh" src="assets/sounds/whoosh.mp3" preload="none"></audio>
<audio id="snd-type" src="assets/sounds/type.mp3" preload="none"></audio>
<audio id="snd-success" src="assets/sounds/success.mp3" preload="none"></audio>
<audio id="snd-error" src="assets/sounds/error.mp3" preload="none"></audio>
<audio id="snd-pageturn" src="assets/sounds/page-turn.wav" preload="none"></audio>
<audio id="snd-bookopen" src="assets/sounds/book-open.mp3" preload="none"></audio>
<audio id="snd-finalchime" src="assets/sounds/final-chime.mp3" preload="none"></audio>
<audio id="snd-finalchime" src="assets/sounds/diary-song.mp3" preload="none"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="assets/js/stars.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/intro.js"></script>
<script src="assets/js/passwords.js"></script>
<script src="assets/js/chase-button.js"></script>
<script src="assets/js/diary-content.js"></script>
<script src="assets/js/book.js"></script>
<script src="assets/js/letter.js"></script>
<script src="assets/js/finale.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
